[project]
name = "mundus-world-model"
version = "0.1.0"
description = "Mundus 0.1: Autonomous Neural Game Engine and Causal Transformer World Model"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Mohamed Taha Enasraoui" },
]
dependencies = [
    "torch>=2.5.0",
    "numpy>=1.26.0",
    "Pillow>=10.0.0",
    "huggingface_hub>=0.25.0",
    "pygame>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [
    "mundus_env",
    "checkpoints",
    ".venv",
    "__pycache__",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"web_player.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
